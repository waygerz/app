name: waygerz
description: Waygerz mobile app (iOS + Android) — social sports pick'em & H2H wagers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2 # Keychain (iOS) / Keystore (Android) token store
  provider: ^6.1.2 # lightweight state management
  # Push. Requires `flutterfire configure` to generate firebase_options.dart +
  # native config before push is initialized — see lib/push/push_service.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
