name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, contests, leagues]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waygerz
          POSTGRES_PASSWORD: waygerz
          POSTGRES_DB: waygerz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waygerz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # Tests run against a dedicated <service>_test schema (conftest asserts it).
      DATABASE_URL: postgresql+psycopg2://waygerz:waygerz@localhost:5432/waygerz
      DB_SCHEMA: ${{ matrix.service }}_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-jwt-secret
      SECRET_KEY: test-secret
      INTERNAL_TOKEN: test-internal-token
      # No sibling services in CI — keep auth's OTP path from trying to reach the
      # notifications host (it falls back to logging the revealed dev code).
      INTERNAL_NOTIFICATIONS_URL: ""

    defaults:
      run:
        working-directory: api/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q
