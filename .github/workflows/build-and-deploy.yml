name: Build & Deploy Service (Waygerz, ARM64)

# Builds one (or all) Waygerz service image(s) for arm64, pushes to ECR
# (waygerz/<service>), and optionally rolls the matching ECS service.
#
# Prereqs (see _docs/INF_PROD.md "ECR / CI-CD" + step 8/9):
#   - GitHub OIDC provider + role waygerz-gha-deploy (trusts repo:waygerz/app)
#   - ECR repos waygerz/<service> exist
#   - ECS cluster waygerz-prod + the service exist (for deploy)
# Repo secrets: AWS_REGION, AWS_ACCOUNT_ID, AWS_GHA_ROLE_ARN, AWS_ECS_CLUSTER

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build/deploy"
        required: true
        type: choice
        options:
          - all
          - auth
          - users
          - friends
          - comments
          - messaging
          - ingestor
          - wallet
          - contests
          - leagues
          - media
          - notifications
          - twilio
          - webui
          - scheduler
      register_taskdef:
        description: "Register new task def revision from <service>/taskdef.json?"
        required: true
        type: boolean
        default: false
      migrate:
        description: "Run `flask db upgrade` (pinned :sha one-off task) BEFORE deploy?"
        required: true
        type: boolean
        default: false
      deploy:
        description: "Roll the ECS service after push?"
        required: true
        type: boolean
        default: true

concurrency:
  group: build-waygerz-${{ github.event.inputs.service || 'unknown' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ROLE_ARN: ${{ secrets.AWS_GHA_ROLE_ARN }}
  ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
  IMAGE_TAG: ${{ github.sha }}
  LATEST_TAG: latest
  PLATFORM: linux/arm64

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Determine services to build
        id: services
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.service }}" = "all" ]; then
            SERVICES='["auth","users","friends","comments","messaging","ingestor","wallet","contests","leagues","media","notifications","twilio","webui","scheduler"]'
          else
            SERVICES='["${{ github.event.inputs.service }}"]'
          fi
          echo "matrix=$SERVICES" >> "$GITHUB_OUTPUT"

  build-push:
    needs: setup
    # Native arm64 runner (free for public repos) — builds the linux/arm64
    # images without QEMU emulation, which was the main source of slow builds.
    runs-on: ubuntu-24.04-arm
    # Cap the job so a hung step (e.g. an OIDC/STS stall) fails in minutes and
    # can be re-dispatched, instead of blocking for GitHub's default 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.setup.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Derive service config
        id: svc
        run: |
          set -euo pipefail
          SVC="${{ matrix.service }}"
          # Backend services live under api/; webui lives at the repo root. ECR
          # repo + ECS service names are unversioned — just ${SVC}.
          echo "REPO=waygerz/${SVC}" >> "$GITHUB_OUTPUT"
          echo "ECS_SERVICE=${SVC}" >> "$GITHUB_OUTPUT"
          # webui is the Next.js standalone app: docker/Dockerfile + baked API
          # base ("" so the browser calls /v1/... directly, matching ALB rules).
          if [ "${SVC}" = "webui" ]; then
            # Dir renamed webui -> web; ECR repo + ECS service stay "webui".
            echo "CTX=web" >> "$GITHUB_OUTPUT"
            echo "DOCKERFILE=web/docker/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "BUILD_ARGS=NEXT_PUBLIC_API_URL=" >> "$GITHUB_OUTPUT"
          else
            echo "CTX=api/${SVC}" >> "$GITHUB_OUTPUT"
            echo "DOCKERFILE=api/${SVC}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "BUILD_ARGS=GIT_SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail fast if build context missing
        run: |
          set -euo pipefail
          [ -d "${{ steps.svc.outputs.CTX }}" ] || { echo "Build context not found: ${{ steps.svc.outputs.CTX }}"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        # STS AssumeRoleWithWebIdentity is normally seconds; this occasionally
        # hangs. Fail in 5 min so a retry isn't blocked for the whole job.
        timeout-minutes: 5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_ARN }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names "${{ steps.svc.outputs.REPO }}" >/dev/null

      # No QEMU: the runner is already arm64, so buildx builds linux/arm64
      # natively.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.svc.outputs.CTX }}
          file: ${{ steps.svc.outputs.DOCKERFILE }}
          build-args: ${{ steps.svc.outputs.BUILD_ARGS }}
          platforms: ${{ env.PLATFORM }}
          push: true
          provenance: false
          tags: |
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ steps.svc.outputs.REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ steps.svc.outputs.REPO }}:${{ env.LATEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Apply DB migrations BEFORE the roll, so the new code never starts against
      # an un-migrated schema. Runs as a one-off ECS task PINNED to the :sha just
      # built (avoids the stale-:latest host-cache no-op), derived from the live
      # service taskdef with the command overridden to `flask db upgrade` — so it
      # inherits the same DATABASE_URL / DB_SCHEMA / roles and runs in-VPC (the
      # only place the prod DB is reachable). Fail-fast: a non-zero migration exit
      # fails the job before the Deploy step. Idempotent (a second upgrade no-ops).
      - name: Run DB migration (pinned :sha one-off task)
        if: ${{ github.event.inputs.migrate == 'true' }}
        run: |
          set -euo pipefail
          SVC="${{ matrix.service }}"
          IMG="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ steps.svc.outputs.REPO }}:${IMAGE_TAG}"
          echo "Deriving migrate taskdef from waygerz-${SVC} (image ${IMG})"
          TD_JSON="$(mktemp)"
          aws ecs describe-task-definition --task-definition "waygerz-${SVC}" \
            --query 'taskDefinition' --output json \
          | jq --arg img "$IMG" --arg name "$SVC" --arg fam "waygerz-${SVC}-migrate" '
              .containerDefinitions |= ( map(select(.name==$name))
                | map(.image=$img
                      | .command=["sh","-c","flask db upgrade"]
                      | del(.portMappings) | del(.healthCheck)) )
              | .family=$fam
              | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
                 requiresCompatibilities, cpu, memory, volumes, placementConstraints}
              | with_entries(select(.value != null and .value != []))
            ' > "$TD_JSON"
          MIG_TD=$(aws ecs register-task-definition --cli-input-json "file://${TD_JSON}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered ${MIG_TD}; running one-off task..."
          TASK_ARN=$(aws ecs run-task --cluster "${ECS_CLUSTER}" --launch-type EC2 \
            --task-definition "${MIG_TD}" --started-by gha-migrate \
            --query 'tasks[0].taskArn' --output text)
          echo "Task ${TASK_ARN}; waiting for it to stop..."
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"
          EXIT=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exitCode=${EXIT}"
          aws ecs deregister-task-definition --task-definition "${MIG_TD}" >/dev/null 2>&1 || true
          if [ "${EXIT}" != "0" ]; then
            echo "::error::Migration FAILED (exit ${EXIT}) — aborting before deploy." >&2
            aws logs tail "/ecs/waygerz/${SVC}" --since 10m 2>/dev/null || true
            exit 1
          fi
          echo "Migration OK."

      - name: Verify ECS service exists
        if: ${{ github.event.inputs.deploy == 'true' }}
        run: |
          set -euo pipefail
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${{ steps.svc.outputs.ECS_SERVICE }}" \
            --query 'services[0].status' --output text >/dev/null

      - name: Register new task definition revision
        if: ${{ github.event.inputs.deploy == 'true' && github.event.inputs.register_taskdef == 'true' }}
        id: taskdef
        run: |
          set -euo pipefail
          TASKDEF_PATH="${{ steps.svc.outputs.CTX }}/taskdef.json"
          [ -f "${TASKDEF_PATH}" ] || { echo "Task definition file not found: ${TASKDEF_PATH}"; exit 1; }
          NEW_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${TASKDEF_PATH}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered ${NEW_TD_ARN}"
          echo "arn=${NEW_TD_ARN}" >> "$GITHUB_OUTPUT"

      - name: Deploy (roll ECS service)
        if: ${{ github.event.inputs.deploy == 'true' }}
        run: |
          set -euo pipefail
          SERVICE="${{ steps.svc.outputs.ECS_SERVICE }}"
          NEW_TD="${{ steps.taskdef.outputs.arn }}"
          if [ -n "${NEW_TD}" ]; then
            echo "Deploying ${SERVICE} with ${NEW_TD}"
            aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${SERVICE}" \
              --task-definition "${NEW_TD}" --force-new-deployment >/dev/null
          else
            echo "Rolling ${SERVICE} (force-new-deployment, re-pulls :latest)"
            aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${SERVICE}" \
              --force-new-deployment >/dev/null
          fi
          echo "Waiting for ${SERVICE} to stabilize..."
          aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${SERVICE}"
          echo "${SERVICE} deployed."

      - name: Print ECS service status on failure
        if: ${{ failure() && github.event.inputs.deploy == 'true' }}
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${{ steps.svc.outputs.ECS_SERVICE }}" \
            --output json
